[workspace]
resolver = "2"
members = [
    "sapphire-core",
    "sapphire-keygen",
    "sapphire-chain",
    "sapphire-escrow",
    "sapphire-node",
    "sapphire-zcash",
    "sapphire-net",
    "sapphire-cli",
    "sapphire-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jules/sapphire"
description = "Decentralized MPC signing network for Zcash"

[workspace.dependencies]
# Local crates
sapphire-core = { path = "sapphire-core" }
sapphire-keygen = { path = "sapphire-keygen" }
sapphire-chain = { path = "sapphire-chain" }
sapphire-escrow = { path = "sapphire-escrow" }
sapphire-node = { path = "sapphire-node" }
sapphire-zcash = { path = "sapphire-zcash" }
sapphire-net = { path = "sapphire-net" }

# FROST stack
frost-core = { version = "2.2", features = ["serde"] }
frost-ed25519 = { version = "2.2", features = ["serde"] }
frost-rerandomized = { version = "2.2", features = ["serde"] }
# RedPallas (Zcash Orchard spend-auth) — currently published on git from ZF
# rather than crates.io; pinned to the same rev the frost-zcash-demo uses.
reddsa = { git = "https://github.com/ZcashFoundation/reddsa.git", rev = "ed49e9ca0699a6450f6d4a9fe62ff168f5ea1ead", features = ["frost"] }

# Async (kept for any future networked transport; chain-driven flow is sync)
tokio = { version = "1.42", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = { version = "0.4", features = ["serde"] }

# Errors / logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Crypto utils
rand = "0.8"
rand_core = "0.6"
zeroize = "1.8"

# Sealed envelopes for DKG round-2 (X25519 + XChaCha20-Poly1305)
crypto_box = { version = "0.9", features = ["chacha20"] }
