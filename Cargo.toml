[workspace]
resolver = "2"
members = [
    "crates/sapphire-core",
    "crates/sapphire-keygen",
    "crates/sapphire-signer",
    "crates/sapphire-coordinator",
    "crates/sapphire-client",
    "crates/sapphire-chain",
    "crates/sapphire-validator",
    "crates/sapphire-cli",
    "crates/sapphire-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jules/sapphire"
description = "Decentralized MPC signing network for Zcash"

[workspace.dependencies]
# Local crates
sapphire-core = { path = "crates/sapphire-core" }
sapphire-keygen = { path = "crates/sapphire-keygen" }
sapphire-signer = { path = "crates/sapphire-signer" }
sapphire-coordinator = { path = "crates/sapphire-coordinator" }
sapphire-client = { path = "crates/sapphire-client" }
sapphire-chain = { path = "crates/sapphire-chain" }
sapphire-validator = { path = "crates/sapphire-validator" }

# FROST stack
frost-core = { version = "2.2", features = ["serde"] }
frost-ed25519 = { version = "2.2", features = ["serde"] }
frost-rerandomized = "2.2"
# RedPallas (Zcash Orchard spend-auth) — currently published on git from ZF
# rather than crates.io; pinned to the same rev the frost-zcash-demo uses.
reddsa = { git = "https://github.com/ZcashFoundation/reddsa.git", rev = "ed49e9ca0699a6450f6d4a9fe62ff168f5ea1ead", features = ["frost"] }

# Async + HTTP
tokio = { version = "1.42", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = { version = "0.4", features = ["serde"] }

# Errors / logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Crypto utils
rand = "0.8"
rand_core = "0.6"
zeroize = "1.8"

# Misc
once_cell = "1.20"
async-trait = "0.1"
